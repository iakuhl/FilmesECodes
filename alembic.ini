# Configuração do Alembic para uso em desenvolvimento — gerar e inspecionar
# revisões do esquema, por exemplo:
#
#   uv run alembic revision --autogenerate -m "descrição da mudança"
#   uv run alembic history
#
# O programa não usa este arquivo: ele migra o banco sozinho ao abri-lo (ver
# src/filmes_e_cubos/adapters/persistence/sqlite/migracao.py). O banco usado
# aqui vem da variável de ambiente FILMES_E_CUBOS_DB (padrão:
# filmes_e_cubos.db no diretório atual).

[alembic]
script_location = src/filmes_e_cubos/adapters/persistence/sqlite/migracoes
file_template = revisao_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
