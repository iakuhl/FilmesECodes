{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="cartao cartao--estreito">
  <h1>Entrar</h1>
  <p class="suave">O site do clube é protegido por uma senha única. Peça a sua a quem administra o clube.</p>
  {% if erro %}<p class="aviso aviso--erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/entrar" class="formulario">
    <input type="hidden" name="proximo" value="{{ proximo }}">
    <label>Senha do clube
      <input type="password" name="senha" autocomplete="current-password" required autofocus>
    </label>
    <button class="botao">Entrar</button>
  </form>
</section>
{% endblock %}
